<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="鸣潮连段社区，按标题、角色和标签检索并下载连段谱。" />
    <meta name="theme-color" content="#161a1d" />
    <title>椰果培养仓</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="assets/vendor/spine-player-4.1.23/spine-player.css" />
    <link rel="stylesheet" href="styles.css?v=20260726-9" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="椰果培养仓首页">
          <img class="brand-icon" src="assets/logo.png" alt="" />
          <span>
            <strong>椰果培养仓</strong>
            <small>WWCOMBO REPOSITORY</small>
          </span>
        </a>
      </div>
    </header>

    <main>
      <section class="search-band" aria-labelledby="pageTitle">
        <div class="hero-spine-layer" id="heroSpineLayer" aria-hidden="true">
          <div id="heroSpine"></div>
        </div>
        <div class="content-width">
          <div class="title-row">
            <div>
              <p class="eyebrow">COMMUNITY COMBOS</p>
              <h1 id="pageTitle">找到适合你的连段轴</h1>
            </div>
            <div class="index-status" id="indexStatus" aria-live="polite">
              <span class="status-dot"></span>
              <span>正在读取索引</span>
            </div>
          </div>

          <form class="search-controls" id="searchForm" role="search">
            <label class="search-field">
              <span class="sr-only">按标题搜索</span>
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="titleInput" type="search" autocomplete="off" placeholder="搜索连段标题" />
              <button class="clear-search" id="clearSearchBtn" type="button" title="清空标题" aria-label="清空标题">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
            </label>

            <button class="character-picker-trigger" id="characterPickerButton" type="button" aria-haspopup="dialog" aria-expanded="false">
              <span class="field-label">角色</span>
              <span class="character-trigger-value">
                <span class="selected-avatar-stack" id="selectedAvatarStack"></span>
                <strong id="characterPickerValue">全部角色</strong>
              </span>
              <i data-lucide="chevron-down" aria-hidden="true"></i>
            </button>

            <label class="select-field">
              <span>排序</span>
              <select id="sortSelect">
                <option value="updated">最近更新</option>
                <option value="title">标题顺序</option>
                <option value="duration">轴长从短到长</option>
              </select>
            </label>
          </form>

        </div>
      </section>

      <section class="results-band" aria-labelledby="resultsTitle">
        <div class="content-width">
          <div class="results-head">
            <div>
              <h2 id="resultsTitle">社区连段</h2>
              <p id="resultCount">0 个结果</p>
            </div>
            <div class="results-tools">
              <div class="tag-filter" aria-labelledby="tagFilterLabel">
                <span id="tagFilterLabel">标签</span>
                <div id="tagList" class="tag-list"></div>
              </div>
              <button id="resetBtn" class="reset-button" type="button">
                <i data-lucide="rotate-ccw" aria-hidden="true"></i>
                重置筛选
              </button>
            </div>
          </div>

          <div id="comboList" class="combo-list" aria-live="polite"></div>

          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="file-search" aria-hidden="true"></i>
            <strong>没有找到对应连段</strong>
            <span>换一个标题、角色或标签试试。</span>
            <button id="emptyResetBtn" type="button">清除筛选</button>
          </div>

          <div id="errorState" class="empty-state error-state" hidden>
            <i data-lucide="cloud-off" aria-hidden="true"></i>
            <strong>暂时无法读取社区索引</strong>
            <span id="errorMessage">请稍后重试。</span>
            <button id="retryBtn" type="button">重新加载</button>
          </div>
        </div>
      </section>
    </main>

    <template id="comboTemplate">
      <article class="combo-card">
        <div class="combo-accent" aria-hidden="true"></div>
        <div class="combo-main">
          <div class="combo-title-row">
            <div>
              <h3></h3>
              <p class="characters"></p>
            </div>
            <div class="combo-tags"></div>
          </div>
          <dl class="combo-meta">
            <div><dt>轮次</dt><dd class="rounds"></dd></div>
            <div><dt>轴长</dt><dd class="duration"></dd></div>
            <div><dt>操作</dt><dd class="steps"></dd></div>
            <div><dt>更新</dt><dd class="updated"></dd></div>
          </dl>
        </div>
        <div class="combo-actions">
          <div class="card-submitter">
            <span>上传者</span>
            <strong class="submitter-name"></strong>
            <small class="submitter-email"></small>
          </div>
          <button class="detail-button" type="button">
            <i data-lucide="panel-right-open" aria-hidden="true"></i>
            详情
          </button>
        </div>
      </article>
    </template>

    <div class="modal-backdrop" id="characterPickerBackdrop" hidden>
      <section class="character-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="characterPickerTitle">
        <header class="modal-header">
          <div>
            <h2 id="characterPickerTitle">选择角色</h2>
            <p id="characterPickerHint">最多选择 3 名角色，选择顺序不影响检索。</p>
          </div>
          <button class="icon-button" id="closeCharacterPickerBtn" type="button" title="关闭" aria-label="关闭角色选择">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </header>
        <div class="picker-toolbar">
          <label class="picker-search">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="sr-only">搜索角色</span>
            <input id="characterSearchInput" type="search" autocomplete="off" placeholder="搜索角色" />
          </label>
          <strong id="characterSelectedCount">已选 0 / 3</strong>
        </div>
        <div class="character-grid" id="characterGrid"></div>
        <footer class="modal-footer">
          <button id="clearCharactersBtn" type="button">清空</button>
          <button id="confirmCharactersBtn" class="primary-button" type="button">完成</button>
        </footer>
      </section>
    </div>

    <div class="modal-backdrop detail-backdrop" id="detailBackdrop" hidden>
      <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <header class="modal-header detail-header">
          <div>
            <p class="eyebrow">COMBO DETAIL</p>
            <h2 id="detailTitle">连段详情</h2>
          </div>
          <button class="icon-button" id="closeDetailBtn" type="button" title="关闭" aria-label="关闭连段详情">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </header>
        <div class="detail-layout">
          <aside class="detail-info">
            <div class="detail-characters" id="detailCharacters"></div>
            <div class="detail-tags" id="detailTags"></div>
            <dl class="detail-meta" id="detailMeta"></dl>
            <section class="detail-section" id="detailDescriptionSection">
              <h3>简介</h3>
              <p id="detailDescription"></p>
            </section>
            <section class="detail-section">
              <h3>上传者</h3>
              <p id="detailSubmitter"></p>
            </section>
            <div class="detail-links">
              <a id="detailSourceLink" class="secondary-button" target="_blank" rel="noreferrer" hidden>
                <i data-lucide="external-link" aria-hidden="true"></i>
                演示链接
              </a>
              <a id="detailDownload" class="primary-button" download>
                <i data-lucide="download" aria-hidden="true"></i>
                下载连段
              </a>
            </div>
          </aside>
          <section class="axis-preview-panel" aria-labelledby="axisPreviewTitle">
            <div class="axis-preview-head">
              <div>
                <h3 id="axisPreviewTitle">连段图</h3>
                <p id="axisPreviewSummary">正在读取连段数据</p>
              </div>
              <div class="axis-preview-options">
                <div class="axis-icon-set" role="group" aria-label="招式图标样式">
                  <button class="active" type="button" data-icon-set="english" aria-pressed="true">字母</button>
                  <button type="button" data-icon-set="chinese" aria-pressed="false">中文</button>
                </div>
                <span class="experimental-badge">实验功能</span>
              </div>
            </div>
            <div class="axis-preview" id="axisPreview">
              <div class="axis-loading"><span></span><span></span><span></span></div>
            </div>
          </section>
        </div>
      </section>
    </div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="assets/vendor/spine-player-4.1.23/spine-player.min.js"></script>
    <script src="app.js?v=20260726-9"></script>
  </body>
</html>
